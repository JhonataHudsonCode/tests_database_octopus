name: Integration Tests

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qa_db
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DATABASE: qa_db
      PG_USER: qa_user
      PG_PASSWORD: qa_password
      PG_CONNECT_TIMEOUT: 5
      PG_TARGET_SCHEMA: pg_catalog
      PG_TARGET_TABLE: pg_type
      OPENSEARCH_HOST: localhost
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_USE_SSL: false
      OPENSEARCH_VERIFY_CERTS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          until curl --fail --silent http://localhost:9200 >/dev/null; do sleep 2; done
          pytest -m integration

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/test-report.html
          if-no-files-found: warn
