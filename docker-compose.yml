services:
  postgres:
    image: postgres:18
    container_name: qa-integration-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 20
